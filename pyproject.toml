[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecsim"
version = "0.1.0"
description = "Embedded Controls Engineer Job Simulator - offline engineering training platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
controls = ["numpy>=1.26", "scipy>=1.11", "control>=0.10", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
ecsim = "ecsim.cli:main"

[project.gui-scripts]
ecsim-gui = "ecsim.gui.main_window:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecsim = ["db/migrations/*.sql", "content/*.yaml", "content/modules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
