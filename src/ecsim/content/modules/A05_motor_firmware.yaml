          /* TODO: safe outputs first; then check Mcu_GetResetReason() */
          Pwm_SetDutyCycle(0u, 0u);
      }

      void task_10ms(void)
      {
          /* TODO:
           *  1. read ADC channel 0 and convert counts -> volts -> rpm
           *  2. range-check the sensor voltage, debounce, latch a fault, report DEM_SPEED_SENSOR
           *  3. PI speed control with anti-windup (reuse B01-E4), output 0..24 V
           *  4. convert volts to PWM duty (0..PWM_DUTY_MAX) or 0 in the safe state
           *  5. service the watchdog from the task you want supervised
           */
      }
    reference: |
      /* Motor speed controller firmware - reference solution */
      #define SPEED_SETPOINT_RPM   3000.0f
      #define V_BAT                24.0f
      #define KP                   0.00174f    /* V/rpm  (tau/(K*tau_cl), tau_cl = 0.1 s) */
      #define KI                   0.0316f     /* V/(rpm*s) (Kp/tau) */
      #define TS                   0.01f
      #define SENSOR_V_MIN         0.25f
      #define SENSOR_V_MAX         4.75f
      #define FAULT_DEBOUNCE       3u          /* x 10 ms */
      #define DEM_SPEED_SENSOR     1u
      #define DEM_WDG_RESET        3u

      static float    v_sum;
      static uint8_t  n_samples;
      static float    v_speed;
      static float    integ;
      static uint8_t  fault_cnt;
      static bool     fault_latched;

      static float adc_to_volts(uint16_t counts)
      {
          return ((float)counts * Adc_GetReferenceVoltage()) / (float)(1UL << Adc_GetResolutionBits());
      }

      void app_init(void)
      {
          Pwm_SetDutyCycle(0u, 0u);
          if (Mcu_GetResetReason() == MCU_RESET_WATCHDOG)
          {
              Dem_SetEventStatus(DEM_WDG_RESET, DEM_EVENT_STATUS_FAILED);
          }
      }

      void task_1ms(void)
      {
          v_sum += adc_to_volts(Adc_ReadChannel(0u));
          n_samples++;
      }

      static void monitor_sensor(void)
      {
          bool out_of_range = (v_speed < SENSOR_V_MIN) || (v_speed > SENSOR_V_MAX);
          if (out_of_range)
          {
              if (fault_cnt < FAULT_DEBOUNCE) { fault_cnt++; }
          }
          else if (fault_cnt > 0u)
          {
              fault_cnt--;
          }
          if ((fault_cnt >= FAULT_DEBOUNCE) && !fault_latched)
          {
              fault_latched = true;
              Dem_SetEventStatus(DEM_SPEED_SENSOR, DEM_EVENT_STATUS_FAILED);
          }
      }

      static float speed_pi(float speed_rpm)
      {
          float e = SPEED_SETPOINT_RPM - speed_rpm;
          float p = KP * e;
          float i_new = integ + (KI * TS * e);
          float u = p + i_new;
          if (u > V_BAT)
          {
              if (e < 0.0f) { integ = i_new; }
          }
          else if (u < 0.0f)
          {
              if (e > 0.0f) { integ = i_new; }
          }
          else
          {
              integ = i_new;
          }
          u = p + integ;
          if (u > V_BAT) { u = V_BAT; }
          if (u < 0.0f)  { u = 0.0f; }
          return u;
      }

      void task_10ms(void)
      {
          uint16_t duty = 0u;
          if (n_samples > 0u)
          {
              v_speed = v_sum / (float)n_samples;
          }
          v_sum = 0.0f;
          n_samples = 0u;
          monitor_sensor();
          if (!fault_latched)
          {
              float speed_rpm = (v_speed - 0.5f) * (6000.0f / 4.0f);
              float u = speed_pi(speed_rpm);
              duty = (uint16_t)((u / V_BAT) * (float)PWM_DUTY_MAX);
          }
          else
          {
              integ = 0.0f;
          }
          Pwm_SetDutyCycle(0u, duty);
          Wdg_Trigger();
      }
