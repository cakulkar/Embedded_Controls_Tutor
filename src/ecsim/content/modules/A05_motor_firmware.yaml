  hints:
  - 'Start with task_10ms only: ADC → volts → rpm → your B01-E4 PI → duty. Get `motor_nominal` passing first.'
  - 'With pole-zero cancellation: Kp = τ/(K·τ_cl) ≈ 0.055/(317 × 0.1) V/rpm and Ki = Kp/τ. Clamp the output to 0…24 V and use clamping anti-windup.'
  - If the sensor reads 0 V, what speed does your controller believe, and what duty does it command? Range-check before you control.
  - Which code still runs when task_10ms hangs? Service the watchdog only from the code that must be alive.
  solution: |
    Reference design (one of many valid designs):

    * `task_1ms` averages 10 ADC samples (simple noise filter); `task_10ms` runs everything else.
    * Range check 0.25–4.75 V, debounced 3 × 10 ms, latched; DEM 1 reported once; PWM 0 and integrator cleared in the fault state.
    * PI: Kp = 0.00174 V/rpm, Ki = 0.0316 V/(rpm·s), clamping anti-windup, output 0–24 V.
    * `Wdg_Trigger()` at the end of `task_10ms` only.
    * `app_init` sets PWM 0 and reports DEM 3 when the reset reason is WATCHDOG.

