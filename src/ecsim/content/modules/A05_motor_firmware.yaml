lessons:
- id: A05-L1
  title: 'Assignment brief: Engineering Task #001'
  body: |
    # Engineering Task #001: motor speed controller firmware

    **Customer requirement:** the electric motor must maintain a commanded speed of
    3,000 rpm under varying load conditions, and must fail safe.

    In B01 you designed and unit-tested the PI controller. Now you integrate it into
    firmware that runs on a virtual ECU in closed loop with a simulated motor. You
    also handle sensor faults and watchdog supervision.

    ### How you are graded
    Your C file is compiled with `-std=c99 -Wall -Wextra -Werror -pedantic`, loaded
    into the virtual ECU, and run through four scenarios (3 s each) on the target
    named in the exercise. Every check is reported with numbers, so a failing check
    tells you *what* went wrong and *when*. Finding out *why* is your job.

    ### Workflow that works
    1. Get `motor_nominal` passing with a plain PI.
    2. Add the sensor range check and safe state, then pass `motor_speed_sensor_open`.
    3. Decide where the watchdog is serviced, then pass `motor_task_hang`.
    4. Port to the TC3xx-style target (A05-E2) and explain any difference.

    Use the **Virtual ECU Lab** screen to run single scenarios and look at the signal
    plots while you develop. Exercises are graded in the Academy.
exercises:
- id: A05-E1
  kind: ecu_app
  title: Motor speed firmware on Cortex-M4
  competency: EMB
  level: advanced
  points: 60
  practical: true
  max_independent_hints: 2
  prompt: |
    Write the complete application for the **generic Cortex-M4F** target.

    **Plant (simulated, do not change):** permanent-magnet DC motor, 24 V supply via
    PWM channel 0 (`duty / PWM_DUTY_MAX × 24 V`). Approximate first-order model:
    K ≈ 317 rpm/V, τ ≈ 55 ms.

    **Inputs:**

    | ADC ch | Signal | Transfer function | Valid range |
    |---|---|---|---|
    | 0 | speed sensor | 0.5 V @ 0 rpm … 4.5 V @ 6000 rpm (linear) | 0.25 – 4.75 V |
    | 1 | motor current | 2.5 V @ 0 A, 50 mV/A | informational |

    ADC: 12-bit, Vref 5.0 V, `V = counts · Vref / 2^bits` (use `Adc_GetResolutionBits()` and
    `Adc_GetReferenceVoltage()` rather than hard-coding). About 2 mV of noise is present.

    **Requirements (each is checked by a scenario):**

    | ID | Requirement | Scenario |
    |---|---|---|
    | R1 | Hold 3000 rpm ± 60 rpm from t = 1.0 s; peak ≤ 3300 rpm | `motor_nominal` |
    | R2 | Recover to ± 60 rpm within 0.5 s of a 0.03 N·m load step | `motor_load_step` |
    | R3 | Speed sensor out of its valid range → report DEM event **1** FAILED within 50 ms and hold PWM at 0 % (latched) | `motor_speed_sensor_open` |
    | R4 | If the control task hangs, the watchdog must reset the ECU; after a watchdog reset, report DEM event **3** FAILED within 50 ms | `motor_task_hang` |
    | R5 | No resets, deadline misses or DEM failures in normal operation | `motor_nominal` |

    Tasks available: `app_init` (required), `task_1ms`, `task_10ms`, `task_100ms`.
    `<stdint.h>`, `<stdbool.h>` and `ecu_hal.h` are already included. Do not define `main` or HAL functions.
