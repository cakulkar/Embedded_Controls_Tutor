       * ecu_hal.h is already included. See the prompt for the full contract.
       */
      #define SPEED_SETPOINT_RPM   3000.0f
      #define DEM_SPEED_SENSOR     1u
      #define DEM_WDG_RESET        3u

      void app_init(void)
