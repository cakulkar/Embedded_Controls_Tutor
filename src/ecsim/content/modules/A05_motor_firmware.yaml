  hints:
  - 'Read the reset detail in the grader output: when, and why?'
  - Count how often your code calls Wdg_Trigger() per 10 ms, and from where.
  solution: |
    The CM4 reference passes unchanged *if* it services the watchdog exactly once per
    10 ms cycle. Two typical porting defects:

    * Servicing from `task_1ms`: only 1 ms between services, so the window is violated and the ECU resets immediately.
    * Servicing twice in `task_10ms` (e.g. at the start "to be safe" and at the end): 0 ms between services, so it resets.

    The windowed safety watchdog turns "harmless" extra services into resets on purpose: a
    runaway that services too often is detected as well as one that stops.
