      checks:
      - name: REQ-S1 initial estimate from rest voltage within ±2 %
        kind: near
        signal: soc_pct_error
        target: 0
        tol: 2
        from: 0
        to: 100
      - name: REQ-S2 error within ±5 % under load
        kind: near
        signal: soc_pct_error
        target: 0
        tol: 5
        from: 120
