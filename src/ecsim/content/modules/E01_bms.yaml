- id: E01-E6
  kind: model_mil
  title: HV precharge and contactor sequencer (MIL)
  competency: VEH
  level: advanced
  points: 40
  practical: true
  max_independent_hints: 1
  prompt: |
    Model the **HV contactor sequencer** (step **0.01 s**, a state machine is the natural choice). It runs in closed loop
    with ECSim's precharge circuit (400 V pack, 50 Ω, 1 mF; in one test 100 Ω; in another the precharge resistor is open).

    | Inports | Outports (0/1) |
    |---|---|
    | 1 `hv_request` · 2 `v_pack_V` · 3 `v_link_V` | 1 `k_precharge` · 2 `k_main` · 3 `fault` |

    | ID | Requirement |
    |---|---|
    | REQ-P1 | All contactors open without a request |
    | REQ-P2 | On request: close precharge, keep main open |
    | REQ-P3 | Close main only when `v_link_V ≥ 95 %` of `v_pack_V` (voltage-based, not time-based) |
    | REQ-P4 | After main is closed, open the precharge contactor |
    | REQ-P5 | Precharge not complete within 0.5 s → fault: all contactors open, main never closes |
    | REQ-P6 | No fault in normal operation; fault latched while the request stays on |
    | REQ-P7 | Request removed → all contactors open |

    This closed-loop plant runs on the ECSim engine (build in the Model Studio, or import your `.slx` there).
  spec:
    interface:
      inports:
      - hv_request
      - v_pack_V
      - v_link_V
      outports:
      - k_precharge
      - k_main
      - fault
      step: 0.01
    tests:
    - name: normal power-up
      type: closed_loop
      plant: precharge
      duration: 1.0
      hv_request:
        step:
          t: 0.1
          before: 0
          after: 1
      checks:
      - name: REQ-P1 all open before request
        kind: at
        signal: k_precharge
        t: 0.05
        min: 0
        max: 0
      - name: REQ-P1 all open before request (main)
        kind: at
        signal: k_main
        t: 0.05
        min: 0
        max: 0
      - name: REQ-P2 precharge closes on request
        kind: at
        signal: k_precharge
        t: 0.12
        min: 1
        max: 1
      - name: REQ-P2 main stays open while precharging
        kind: at
        signal: k_main
        t: 0.12
        min: 0
        max: 0
      - name: REQ-P3 main closes only above 95 % of pack voltage
        kind: within
        signal: v_link_V
        min: 380
        from: 0.26
        to: 0.27
      - name: REQ-P3 main closed
        kind: at
        signal: k_main
        t: 0.5
        min: 1
        max: 1
      - name: REQ-P4 precharge relay opened after main closed
        kind: at
        signal: k_precharge
        t: 0.5
        min: 0
        max: 0
      - name: REQ-P6 no fault in normal operation
        kind: at
        signal: fault
        t: 0.9
        min: 0
        max: 0
    - name: main closes on voltage, not time
      type: closed_loop
      plant: precharge
      plant_params:
        r_pre: 100.0
      duration: 1.0
      hv_request:
        step:
          t: 0.1
          before: 0
          after: 1
      checks:
      - name: 'REQ-P3 slower precharge: main still open at 0.25 s'
        kind: at
        signal: k_main
        t: 0.35
        min: 0
        max: 0
      - name: REQ-P3 main closes once charged
        kind: at
        signal: k_main
        t: 0.6
        min: 1
        max: 1
    - name: open precharge resistor
      type: closed_loop
      plant: precharge
      plant_params:
        resistor_open_at: 0.0
      duration: 1.5
      hv_request:
        step:
          t: 0.1
          before: 0
          after: 1
      checks:
      - name: REQ-P5 no fault before 0.5 s
        kind: at
        signal: fault
        t: 0.55
        min: 0
        max: 0
      - name: REQ-P5 fault when precharge does not complete in 0.5 s
        kind: at
        signal: fault
        t: 0.7
        min: 1
        max: 1
      - name: REQ-P5 all contactors open on fault
        kind: at
        signal: k_precharge
        t: 0.7
        min: 0
        max: 0
      - name: REQ-P5 main never closes on a failed precharge
        kind: at
        signal: k_main
        t: 1.4
        min: 0
        max: 0
      - name: REQ-P6 fault latched while request stays on
        kind: at
        signal: fault
        t: 1.4
        min: 1
        max: 1
    - name: shutdown
      type: closed_loop
      plant: precharge
      duration: 1.0
      hv_request:
        pulse:
          t0: 0.1
          t1: 0.6
      checks:
      - name: REQ-P7 main opens when request removed
        kind: at
        signal: k_main
        t: 0.65
        min: 0
        max: 0
      - name: REQ-P7 precharge open when off
        kind: at
        signal: k_precharge
        t: 0.65
        min: 0
        max: 0
