  - Group STARTING and RUN in a parent state ACTIVE. Which state should own the over-temperature transition?
  - Use after(2, sec) on the transition leaving STARTING. Set both outputs in every state's entry action.
  solution: |
    Reference chart: OFF; ACTIVE {STARTING (default), RUN}; FAULT. ACTIVE→FAULT on over-temperature with the highest priority, STARTING→FAULT on `after(2, sec)`, FAULT→OFF only on `enable_cmd == 0`.

