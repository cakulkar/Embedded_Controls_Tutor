id: A03
department: A
title: "Periodic tasks, timing and target microcontrollers"
ordinal: 3
version: "1"

lessons:
  - id: A03-L1
    title: "Periodic tasks, priorities and CPU load"
    body: |
      # Periodic tasks

      Most ECU software is a set of **periodic tasks**: a 1 ms task for fast I/O
      and current loops, 10 ms for control loops, 100 ms for supervision and
      diagnostics. An OSEK/AUTOSAR-style OS runs them with **fixed priorities** and
      **preemption**: a higher-priority task interrupts a lower one when released.

      ### Rate-monotonic priorities
      Give shorter periods higher priority. For independent periodic tasks with
      deadline = period, Liu & Layland (1973) showed the set is schedulable under
      rate-monotonic priorities if total utilisation satisfies

      $$ U = \sum_i \frac{C_i}{T_i} \le n\,(2^{1/n} - 1) $$

      where `C` is the worst-case execution time (WCET) and `T` the period. The
      bound is *sufficient, not necessary*. Response-time analysis gives an exact
      answer, and harmonic periods (1/10/100 ms) can be scheduled up to U = 1.

      ### What happens on an overrun
      If a task is still running when its next activation arrives, a typical OS
      configuration with an activation limit of 1 **rejects the new activation**
      (OSEK `E_OS_LIMIT`) and calls an error hook. Your 10 ms control loop silently
      becomes a 20 ms loop. Production projects therefore budget CPU load (often a
      target well below 100 %, for example 60–70 %, to leave margin for change) and
      measure real execution times on target with tracing tools.

  - id: A03-L2
    title: "The ECSim virtual ECU: what is and isn't simulated"
    body: |
      # The virtual ECU

      Your application is plain C compiled into a library and linked against a small
      HAL (`ecu_hal.h`). The names are modelled on AUTOSAR MCAL/BSW modules so they
      look familiar at work, but this is **not** an AUTOSAR stack.

      | Call | Purpose |
      |---|---|
      | `Adc_ReadChannel(ch)` | raw counts; `V = counts · Vref / 2^bits` |
      | `Pwm_SetDutyCycle(ch, duty)` | 0…10000 = 0…100.00 % |
      | `Dio_ReadChannel / Dio_WriteChannel` | digital I/O |
      | `Wdg_Trigger()` | service the watchdog |
      | `Dem_SetEventStatus(id, status)` | report a diagnostic event (passed/failed) |
      | `Mcu_GetResetReason()` | power-on, watchdog or software reset |
      | `Os_GetTimeMs()` | time since power-on |

      You define `app_init()` and any of `task_1ms()`, `task_10ms()`, `task_100ms()`.

      ### Execution model
      | Simulated | How |
      |---|---|
      | Task releases, priorities, preemption, CPU load | microsecond scheduler using each task's **modelled WCET** from the target profile |
      | Overruns | activation dropped and logged as a deadline miss; that activation's code does **not** run |
      | Watchdog | timeout, plus a minimum window on the TC3xx-style profile |
      | Reset | library reloaded from a fresh copy, so all static variables restart; diagnostic memory is kept |
      | ADC | quantisation, noise, injected faults (offset, stuck, open, short to supply) |

      | **Not** simulated | Why it matters |
      |---|---|
      | Instruction-level timing of *your* code | Real WCET must be measured or analysed on target |
      | Interrupts preempting in the middle of a function | Shared-data races are taught with dedicated exercises instead |
      | Caches, pipelines, bus contention | Can change timing on real silicon |
      | Physical HIL (dSPACE, NI) | This is a software-in-the-loop **simulated** HIL |

  - id: A03-L3
    title: "Cortex-M vs AURIX TC3xx-style targets"
    body: |
      # Two target families

      ECSim offers two profiles behind one HAL, so the same application can be
      ported and the differences become visible.

      | | Generic Cortex-M4F | AURIX TC3xx-style |
      |---|---|---|
      | Typical use | body, actuator, smaller ECUs | powertrain, chassis, safety ECUs |
      | Cores | 1 | several TriCore CPUs; some devices add lockstep checker cores |
      | Watchdog | simple timeout | per-CPU watchdogs plus a **safety watchdog**; ECSim models a *windowed* watchdog |
      | In ECSim | fully simulated | core 0 only; multi-core labs come later |

      ### Why a window?
      A timeout watchdog only catches software that stops. A windowed watchdog also
      catches software that runs **too fast**: a runaway loop or a scheduler fault
      that services the watchdog repeatedly. Servicing before the window opens is a
      fault. Code that is "fine" on a timeout watchdog can therefore reset at once
      on a windowed one. You will see that in exercise A05-E2.

      Always confirm the actual watchdog behaviour, window rules and reset
      sources in the reference manual for the exact device you are using. The
      ECSim profiles are representative of each class and do not describe a
      specific part number.

exercises:
  - id: A03-E1
    kind: numeric
    title: "CPU load of a task set"
    competency: EMB
    level: beginner
    points: 10
    prompt: |
      A Cortex-M ECU runs three tasks:

      | Task | Period | WCET |
      |---|---|---|
      | task_1ms | 1 ms | 120 µs |
      | task_10ms | 10 ms | 900 µs |
      | task_100ms | 100 ms | 2.5 ms |

      What is the worst-case CPU utilisation in percent? (±0.1)
    spec: {answer: 23.5, abs_tol: 0.1, unit: "%"}
    hints:
      - "Utilisation of one task is C/T. Use the same time unit for both."
    solution: "U = 120/1000 + 900/10000 + 2500/100000 = 0.12 + 0.09 + 0.025 = **23.5 %**."

  - id: A03-E2
    kind: numeric
    title: "Liu & Layland bound for three tasks"
    competency: EMB
    level: intermediate
    points: 10
    prompt: |
      What is the Liu & Layland rate-monotonic utilisation bound for **three**
      tasks, in percent? (±0.05)
    spec: {answer: 77.98, abs_tol: 0.05, unit: "%"}
    hints:
      - "n(2^(1/n) − 1) with n = 3."
    solution: |
      3·(2^(1/3) − 1) = 3 × 0.25992 = 0.7798 → **77.98 %**. A set above this bound is
      not necessarily unschedulable; harmonic 1/10/100 ms periods are schedulable up
      to 100 %.

  - id: A03-E3
    kind: choice
    title: "A 10 ms task that takes 12 ms"
    competency: EMB
    level: intermediate
    points: 15
    prompt: |
      After a software update, task_10ms has a WCET of 12 ms. task_1ms (higher
      priority, 120 µs) is unchanged. The OS has an activation limit of 1. What do
      you observe?
    spec:
      options:
        - "The OS queues the activations and catches up; the controller is merely delayed."
        - "task_1ms is blocked until task_10ms finishes, so all I/O stops."
        - "Every second activation of task_10ms is rejected and an overrun/deadline miss is reported: the control loop effectively runs every 20 ms, and anything serviced from that task runs at half rate."
        - "Nothing: the watchdog compensates for overruns."
      correct: [2]
    hints:
      - "How much CPU does task_10ms get per millisecond while task_1ms keeps running?"
      - "When is task_10ms still running at its next release time?"
    solution: |
      **Option 3.** task_10ms gets ~880 µs per ms, so 12 ms of work takes ~13.6 ms. At
      t = 10 ms it is still running, so that activation is rejected. It finishes at
      ~14 ms and the activation at 20 ms is accepted. The loop runs at 20 ms. A PI
      tuned for 10 ms now has the wrong effective gain and phase. This is exactly
      the "ECU misses a real-time deadline" defect class.

  - id: A03-E4
    kind: choice
    title: "Where to service the watchdog"
    competency: FUS
    level: intermediate
    points: 10
    prompt: |
      An ECU has task_1ms (highest priority) and task_10ms (motor control). Where
      should the watchdog be serviced so that a hang in the motor-control software
      leads to a reset?
    spec:
      options:
        - "In task_1ms, because it runs most often and never misses the timeout."
        - "In a timer interrupt, independent of the tasks."
        - "From the supervised software: here task_10ms, or better a supervisor that only services the watchdog when every monitored task has reported alive within its expected period."
        - "Disable the watchdog during development and enable it at release."
      correct: [2]
    hints:
      - "If task_10ms hangs, which code keeps running?"
    solution: |
      **Option 3.** Servicing from a high-rate task or ISR proves only that *that*
      context runs. The hung control task would never cause a reset. Production
      systems use alive supervision (the concept behind AUTOSAR WdgM): each task
      reports checkpoints, and the watchdog is serviced only if all reported. The
      ECSim scenario `motor_task_hang` tests exactly this.
