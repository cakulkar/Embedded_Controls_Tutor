    (Forward Euler, gain Ki = 0.0316, limits 0…24) → Sum(++) → Saturation(0…24) → Outport.

    **In Simulink:** same blocks, In1 `speed_meas_rpm`, Out1 `voltage_cmd_V`, Discrete-Time Integrator with
    *Limit output* 0/24, Solver *Fixed-step discrete* 0.01, saved as `speed_pi.slx`.

