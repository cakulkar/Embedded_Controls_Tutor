    reference: |
      {
        "tests": [
          {
            "name": "start and run",
            "duration": 1.0,
            "inputs": {
              "enable_cmd": {
                "step": {
                  "t": 0.1,
                  "before": 0,
                  "after": 1
                }
              },
              "speed_rpm": {
                "step": {
                  "t": 0.3,
                  "before": 0,
                  "after": 600
                }
              },
              "overtemp": {
                "const": 0
              }
            },
            "checks": [
              {
                "name": "OFF before enable",
                "kind": "at",
                "signal": "mode",
                "t": 0.05,
                "min": 0,
                "max": 0
              },
              {
                "name": "STARTING",
                "kind": "at",
                "signal": "mode",
                "t": 0.2,
                "min": 1,
                "max": 1
              },
              {
                "name": "PWM while starting",
                "kind": "at",
                "signal": "pwm_allowed",
                "t": 0.2,
                "min": 1,
                "max": 1
              },
              {
                "name": "RUN above 500 rpm",
                "kind": "at",
                "signal": "mode",
                "t": 0.5,
                "min": 2,
                "max": 2
              }
            ]
          },
          {
            "name": "threshold boundary",
            "duration": 1.0,
            "inputs": {
              "enable_cmd": {
                "step": {
                  "t": 0.1,
                  "before": 0,
                  "after": 1
                }
              },
              "speed_rpm": {
                "const": 499
              },
              "overtemp": {
                "const": 0
              }
            },
            "checks": [
              {
                "name": "499 rpm is not RUN",
                "kind": "at",
                "signal": "mode",
                "t": 0.9,
                "min": 1,
                "max": 1
              }
            ]
          },
          {
            "name": "start timeout",
            "duration": 2.5,
            "inputs": {
              "enable_cmd": {
                "step": {
                  "t": 0.1,
                  "before": 0,
                  "after": 1
                }
              },
              "speed_rpm": {
                "const": 0
              },
              "overtemp": {
                "const": 0
              }
            },
            "checks": [
              {
                "name": "still starting at 1.95 s",
                "kind": "at",
                "signal": "mode",
                "t": 2.05,
                "min": 1,
                "max": 1
              },
              {
                "name": "FAULT just after 2 s",
                "kind": "at",
                "signal": "mode",
                "t": 2.15,
                "min": 3,
                "max": 3
              },
              {
                "name": "no PWM in FAULT",
                "kind": "at",
                "signal": "pwm_allowed",
                "t": 2.15,
                "min": 0,
                "max": 0
              }
            ]
          },
          {
            "name": "overtemp while starting, latch, reset",
            "duration": 1.5,
            "inputs": {
              "enable_cmd": {
                "pulse": {
                  "t0": 0.1,
                  "t1": 1.0
                }
              },
              "speed_rpm": {
                "const": 0
              },
              "overtemp": {
                "pulse": {
                  "t0": 0.3,
                  "t1": 0.4
                }
              }
            },
            "checks": [
              {
                "name": "FAULT from STARTING",
                "kind": "at",
                "signal": "mode",
                "t": 0.35,
                "min": 3,
                "max": 3
              },
              {
                "name": "latched after cause clears",
                "kind": "at",
                "signal": "mode",
                "t": 0.8,
                "min": 3,
                "max": 3
              },
              {
                "name": "OFF after disable",
                "kind": "at",
                "signal": "mode",
                "t": 1.2,
                "min": 0,
                "max": 0
              }
            ]
          },
          {
            "name": "disable while running",
            "duration": 1.0,
            "inputs": {
              "enable_cmd": {
                "pulse": {
                  "t0": 0.1,
                  "t1": 0.6
                }
              },
              "speed_rpm": {
                "const": 800
              },
              "overtemp": {
                "const": 0
              }
            },
            "checks": [
              {
                "name": "RUN",
                "kind": "at",
                "signal": "mode",
                "t": 0.5,
                "min": 2,
                "max": 2
              },
              {
                "name": "OFF after disable in RUN",
                "kind": "at",
                "signal": "mode",
                "t": 0.7,
                "min": 0,
                "max": 0
              },
              {
                "name": "no PWM when OFF",
                "kind": "at",
                "signal": "pwm_allowed",
                "t": 0.7,
                "min": 0,
                "max": 0
              }
            ]
          }
        ]
      }
