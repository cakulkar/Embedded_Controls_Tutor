  hints:
  - Where does the integrator state live numerically when its initial condition is 360 000?
  - Integrate the change in charge from 0, then add the 360 000 As offset after the integrator.
  solution: |
    Discrete-Time Integrator (gain 1, initial 0) → Sum(+ +) with Constant 360000 → Outport. The state holds only the change (≤ a few thousand As), where float32 resolves 0.0005 As.

